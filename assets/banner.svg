<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Uma Chandra Sekhara Sarma Thadepalli — full-stack developer">
  <defs>
    <linearGradient id="name-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#fb923c;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#fb923c;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#fb923c">
        <animate attributeName="stop-color" values="#fb923c;#38bdf8;#818cf8;#fb923c" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <style>
      .name { font: 700 34px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; }
      .role { font: 500 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #8b949e; }
      /* One 7s story on loop: laptop appears, the pulse draws across,
         the rocket pops when it lands, everything rests, then repeats. */
      .pulse {
        stroke-dasharray: 640;
        animation: pulse-cycle 7s ease-in-out infinite;
      }
      @keyframes pulse-cycle {
        0%   { stroke-dashoffset: 640; opacity: 1; }
        8%   { stroke-dashoffset: 640; }
        55%  { stroke-dashoffset: 0; }
        86%  { stroke-dashoffset: 0; opacity: 1; }
        93%  { stroke-dashoffset: 0; opacity: 0; }
        100% { stroke-dashoffset: 640; opacity: 0; }
      }
      .laptop {
        animation: laptop-cycle 7s ease-in-out infinite;
      }
      @keyframes laptop-cycle {
        0%       { opacity: 0; }
        6%, 86%  { opacity: 1; }
        93%,100% { opacity: 0; }
      }
      .rocket {
        animation: rocket-cycle 7s ease-in-out infinite;
      }
      @keyframes rocket-cycle {
        0%, 54%  { opacity: 0; transform: translateY(6px); }
        61%, 86% { opacity: 1; transform: translateY(0); }
        93%,100% { opacity: 0; transform: translateY(0); }
      }
    </style>
  </defs>

  <text x="400" y="52" text-anchor="middle" class="name" fill="url(#name-gradient)">Uma Chandra Sekhara Sarma Thadepalli</text>

  <text x="92" y="93" text-anchor="middle" font-size="26" class="laptop" aria-hidden="true">💻</text>
  <polyline class="pulse" points="120,84 300,84 330,84 345,64 365,102 380,74 390,84 420,84 680,84"
            fill="none" stroke="url(#name-gradient)" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" />
  <text x="708" y="93" text-anchor="middle" font-size="26" class="rocket" aria-hidden="true">🚀</text>

  <g text-anchor="middle">
    <text x="400" y="130" class="role" opacity="0">
      Full-stack developer
      <animate attributeName="opacity" values="0;1;1;0;0;0;0" keyTimes="0;0.06;0.28;0.34;0.4;0.9;1" dur="12s" repeatCount="indefinite" />
    </text>
    <text x="400" y="130" class="role" opacity="0">
      React · TypeScript · Node.js · Java · Spring
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.3;0.36;0.42;0.6;0.66;1" dur="12s" repeatCount="indefinite" />
    </text>
    <text x="400" y="130" class="role" opacity="0">
      Building systems that survive concurrent users
      <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;0.62;0.68;0.74;0.94;1;1" dur="12s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
